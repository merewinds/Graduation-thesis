[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setcover-research"
version = "0.1.0"
description = "Reproducible Set Cover experiments"
requires-python = ">=3.10"
dependencies = ["scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["setcover*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
